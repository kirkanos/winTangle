name: release

# Ausgeloest durch einen Tag wie v0.1.0. Baut die Exe, packt sie und legt eine
# GitHub-Release-Seite mit Aenderungen und Pruefsumme an.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write  # noetig, um die Release-Seite anzulegen

jobs:
  release:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash  # auf dem Windows-Runner ist Git Bash vorhanden

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # gesamte Historie fuer die Aenderungsliste

      # Die Versionsnummer steckt in der Exe (VERSIONINFO aus der CMakeLists).
      # Laeuft sie gegen den Tag auseinander, wird hier abgebrochen, statt eine
      # falsch beschriftete Exe zu veroeffentlichen.
      - name: Version gegen Tag pruefen
        id: version
        run: |
          tag="${GITHUB_REF_NAME}"
          version="${tag#v}"
          cmake_version=$(grep -oE 'project\(WinTangle VERSION [0-9]+\.[0-9]+\.[0-9]+' CMakeLists.txt \
                          | grep -oE '[0-9]+\.[0-9]+\.[0-9]+')
          if [ "$version" != "$cmake_version" ]; then
            echo "::error::Tag $tag passt nicht zur Version $cmake_version in CMakeLists.txt"
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Bauen
        run: |
          cmake -S . -B build -A x64
          cmake --build build --config Release -j

      - name: Tests
        run: ctest --test-dir build -C Release --output-on-failure

      # Inno Setup liegt nicht in jedem Runner-Image, deshalb sicherheitshalber
      # nachinstallieren. Ist es da, kostet der Schritt Sekunden.
      - name: Inno Setup bereitstellen
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup -y --no-progress
          }
          "ISCC=$iscc" >> $env:GITHUB_ENV

      - name: Portables Archiv packen
        id: package
        run: |
          version="${{ steps.version.outputs.version }}"
          name="wintangle-${version}-x64"
          mkdir -p "dist/${name}"
          cp build/src/platform/Release/wintangle.exe "dist/${name}/"
          # WinSparkle liegt nach dem Build neben der Exe.
          cp build/src/platform/Release/WinSparkle.dll "dist/${name}/"
          cp LICENSE README.md CHANGELOG.md "dist/${name}/"
          (cd dist && 7z a -tzip "${name}.zip" "${name}" > /dev/null)
          echo "name=${name}" >> "$GITHUB_OUTPUT"

      - name: Installer bauen
        id: installer
        run: |
          version="${{ steps.version.outputs.version }}"
          "$ISCC" //DAppVersion="${version}" packaging/wintangle.iss
          ls -l dist/
          echo "name=wintangle-${version}-setup.exe" >> "$GITHUB_OUTPUT"

      - name: Pruefsummen
        id: checksums
        run: |
          cd dist
          sha256sum *.zip *.exe > SHA256SUMS.txt
          cat SHA256SUMS.txt
          echo "block<<EOF" >> "$GITHUB_OUTPUT"
          cat SHA256SUMS.txt >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      # Der Feed, den die installierte Fassung taeglich abfragt.
      - name: Appcast erzeugen
        run: |
          python packaging/make_appcast.py \
            --version "${{ steps.version.outputs.version }}" \
            --tag "${{ steps.version.outputs.tag }}" \
            --repo "${GITHUB_REPOSITORY}" \
            --installer "dist/${{ steps.installer.outputs.name }}" \
            --output dist/appcast.xml
          cat dist/appcast.xml

      # Die Release-Notizen bestehen aus dem Abschnitt der CHANGELOG.md zu
      # dieser Version plus der Commit-Liste seit dem vorigen Tag. Fehlt der
      # Abschnitt, bleibt immer noch die Commit-Liste uebrig.
      - name: Release-Notizen zusammenstellen
        run: |
          version="${{ steps.version.outputs.version }}"
          tag="${{ steps.version.outputs.tag }}"
          previous=$(git describe --tags --abbrev=0 "${tag}^" 2>/dev/null || true)

          {
            if awk -v v="$version" '
                 $0 ~ "^## \\[" v "\\]" { found=1; next }
                 found && (/^## / || /^\[[^]]+\]: /) { exit }
                 found { print }
               ' CHANGELOG.md | grep -q '[^[:space:]]'; then
              awk -v v="$version" '
                $0 ~ "^## \\[" v "\\]" { found=1; next }
                found && (/^## / || /^\[[^]]+\]: /) { exit }
                found { print }
              ' CHANGELOG.md
            else
              echo "_Kein CHANGELOG-Eintrag für ${version}._"
              echo
            fi

            echo "## Commits"
            echo
            if [ -n "$previous" ]; then
              git log --no-merges --pretty='- %s (%h)' "${previous}..${tag}"
            else
              git log --no-merges --pretty='- %s (%h)' "${tag}"
            fi

            echo
            echo "## Installation"
            echo
            echo "- **\`${{ steps.installer.outputs.name }}\`** – Setup, richtet Autostart,"
            echo "  Deinstallation und die automatische Update-Prüfung ein."
            echo "- **\`${{ steps.package.outputs.name }}.zip\`** – portabel, einfach entpacken."
            echo
            echo "Windows 10/11 x64. Nichts davon ist signiert – SmartScreen meldet sich"
            echo "beim ersten Start; die Prüfsummen unten decken das ab."
            echo
            echo "Eine bereits installierte Fassung meldet sich von selbst: WinTangle"
            echo "prüft einmal täglich gegen diese Release-Seite."
            echo
            echo "## Prüfsummen"
            echo
            echo '```'
            echo "${{ steps.checksums.outputs.block }}"
            echo '```'

            if [ -n "$previous" ]; then
              echo
              echo "**Vollständiger Vergleich:** https://github.com/${GITHUB_REPOSITORY}/compare/${previous}...${tag}"
            fi
          } > release-notes.md

          cat release-notes.md

      - name: Release anlegen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${{ steps.version.outputs.tag }}"
          name="${{ steps.package.outputs.name }}"
          # Tags mit Suffix (v0.2.0-rc1) werden als Vorabversion markiert.
          prerelease=""
          case "$tag" in *-*) prerelease="--prerelease";; esac

          gh release create "$tag" \
            --title "WinTangle ${{ steps.version.outputs.version }}" \
            --notes-file release-notes.md \
            $prerelease \
            "dist/${name}.zip" \
            "dist/${{ steps.installer.outputs.name }}" \
            "dist/SHA256SUMS.txt" \
            "dist/appcast.xml"
