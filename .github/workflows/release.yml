name: release

# Triggered by a tag such as v0.1.0. Builds the executable, packages it and
# creates a GitHub release page with the changes and checksums.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write  # needed to create the release page

jobs:
  release:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash  # Git Bash is available on the Windows runner

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # full history for the change list

      # The version number is baked into the executable (VERSIONINFO from the
      # CMakeLists). If it disagrees with the tag, stop here rather than publish
      # a mislabelled binary.
      - name: Check version against tag
        id: version
        run: |
          tag="${GITHUB_REF_NAME}"
          version="${tag#v}"
          cmake_version=$(grep -oE 'project\(WinTangle VERSION [0-9]+\.[0-9]+\.[0-9]+' CMakeLists.txt \
                          | grep -oE '[0-9]+\.[0-9]+\.[0-9]+')
          if [ "$version" != "$cmake_version" ]; then
            echo "::error::Tag $tag does not match version $cmake_version in CMakeLists.txt"
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Build
        run: |
          cmake -S . -B build -A x64
          cmake --build build --config Release -j

      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure

      # Inno Setup is not part of every runner image, so install it just in
      # case. When it is already there the step costs seconds.
      - name: Provide Inno Setup
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup -y --no-progress
          }
          "ISCC=$iscc" >> $env:GITHUB_ENV

      - name: Package portable archive
        id: package
        run: |
          version="${{ steps.version.outputs.version }}"
          name="wintangle-${version}-x64"
          mkdir -p "dist/${name}"
          cp build/src/platform/Release/wintangle.exe "dist/${name}/"
          # After the build WinSparkle sits next to the executable.
          cp build/src/platform/Release/WinSparkle.dll "dist/${name}/"
          cp LICENSE README.md CHANGELOG.md "dist/${name}/"
          (cd dist && 7z a -tzip "${name}.zip" "${name}" > /dev/null)
          echo "name=${name}" >> "$GITHUB_OUTPUT"

      - name: Build installer
        id: installer
        run: |
          version="${{ steps.version.outputs.version }}"
          "$ISCC" //DAppVersion="${version}" packaging/wintangle.iss
          ls -l dist/
          echo "name=wintangle-${version}-setup.exe" >> "$GITHUB_OUTPUT"

      - name: Checksums
        id: checksums
        run: |
          cd dist
          sha256sum *.zip *.exe > SHA256SUMS.txt
          cat SHA256SUMS.txt
          echo "block<<EOF" >> "$GITHUB_OUTPUT"
          cat SHA256SUMS.txt >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      # The feed an installed copy polls once a day.
      - name: Generate appcast
        run: |
          python packaging/make_appcast.py \
            --version "${{ steps.version.outputs.version }}" \
            --tag "${{ steps.version.outputs.tag }}" \
            --repo "${GITHUB_REPOSITORY}" \
            --installer "dist/${{ steps.installer.outputs.name }}" \
            --output dist/appcast.xml
          cat dist/appcast.xml

      # The release notes consist of this version's section from CHANGELOG.md
      # plus the commit list since the previous tag. If the section is missing,
      # the commit list still stands on its own.
      - name: Assemble release notes
        run: |
          version="${{ steps.version.outputs.version }}"
          tag="${{ steps.version.outputs.tag }}"
          previous=$(git describe --tags --abbrev=0 "${tag}^" 2>/dev/null || true)

          {
            if awk -v v="$version" '
                 $0 ~ "^## \\[" v "\\]" { found=1; next }
                 found && (/^## / || /^\[[^]]+\]: /) { exit }
                 found { print }
               ' CHANGELOG.md | grep -q '[^[:space:]]'; then
              awk -v v="$version" '
                $0 ~ "^## \\[" v "\\]" { found=1; next }
                found && (/^## / || /^\[[^]]+\]: /) { exit }
                found { print }
              ' CHANGELOG.md
            else
              echo "_No CHANGELOG entry for ${version}._"
              echo
            fi

            echo "## Commits"
            echo
            if [ -n "$previous" ]; then
              git log --no-merges --pretty='- %s (%h)' "${previous}..${tag}"
            else
              git log --no-merges --pretty='- %s (%h)' "${tag}"
            fi

            echo
            echo "## Installation"
            echo
            echo "- **\`${{ steps.installer.outputs.name }}\`** – installer; sets up"
            echo "  autostart, uninstall and automatic update checking."
            echo "- **\`${{ steps.package.outputs.name }}.zip\`** – portable, just unzip."
            echo
            echo "Windows 10/11 x64. Nothing here is signed – SmartScreen will speak up"
            echo "on first launch; the checksums below cover that."
            echo
            echo "An already installed copy will notice on its own: WinTangle checks"
            echo "this release page once a day."
            echo
            echo "## Checksums"
            echo
            echo '```'
            echo "${{ steps.checksums.outputs.block }}"
            echo '```'

            if [ -n "$previous" ]; then
              echo
              echo "**Full comparison:** https://github.com/${GITHUB_REPOSITORY}/compare/${previous}...${tag}"
            fi
          } > release-notes.md

          cat release-notes.md

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${{ steps.version.outputs.tag }}"
          name="${{ steps.package.outputs.name }}"
          # Tags with a suffix (v0.2.0-rc1) are marked as a pre-release.
          prerelease=""
          case "$tag" in *-*) prerelease="--prerelease";; esac

          gh release create "$tag" \
            --title "WinTangle ${{ steps.version.outputs.version }}" \
            --notes-file release-notes.md \
            $prerelease \
            "dist/${name}.zip" \
            "dist/${{ steps.installer.outputs.name }}" \
            "dist/SHA256SUMS.txt" \
            "dist/appcast.xml"
