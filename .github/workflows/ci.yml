name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # The calculation core is platform free. Building it on Linux as well keeps
  # that separation honest: if anyone accidentally pulls <windows.h> into the
  # core, it shows up here immediately.
  core:
    name: Core (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug
      - run: cmake --build build -j
      - run: ctest --test-dir build --output-on-failure

  windows:
    name: App (Windows, MSVC)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - run: cmake -S . -B build -A x64
      - run: cmake --build build --config Release -j
      - run: ctest --test-dir build -C Release --output-on-failure
      - uses: actions/upload-artifact@v7
        with:
          name: wintangle-x64-${{ github.sha }}
          path: build/src/platform/Release/wintangle.exe
          retention-days: 14
