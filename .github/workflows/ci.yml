name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # Der Berechnungskern ist plattformfrei. Ihn zusaetzlich unter Linux zu
  # bauen haelt diese Trennung ehrlich: zieht jemand versehentlich
  # <windows.h> in den Kern, faellt es hier sofort auf.
  core:
    name: Kern (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug
      - run: cmake --build build -j
      - run: ctest --test-dir build --output-on-failure

  windows:
    name: App (Windows, MSVC)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - run: cmake -S . -B build -A x64
      - run: cmake --build build --config Release -j
      - run: ctest --test-dir build -C Release --output-on-failure
      - uses: actions/upload-artifact@v4
        with:
          name: wintangle-x64-${{ github.sha }}
          path: build/src/platform/Release/wintangle.exe
          retention-days: 14
